---
- name: Fetch SCRAM verifiers from PostgreSQL primary
  community.postgresql.postgresql_query:
    db: postgres
    login_user: postgres
    login_host: "{{ patroni_primary_host }}"
    login_port: "{{ postgresql_port }}"
    login_password: "{{ postgres_superuser_password }}"
    query: >
      SELECT rolname, rolpassword
      FROM pg_authid
      WHERE rolname = ANY(%s)
        AND rolpassword IS NOT NULL
    positional_args:
      - "{{ pgbouncer_auth_users }}"
  register: pgbouncer_scram_result
  delegate_to: localhost
  no_log: true
  when: pgbouncer_auth_users | length > 0
  tags: [pgbouncer, pgbouncer-config]

- name: Assert all SCRAM verifiers were returned
  ansible.builtin.assert:
    that:
      - pgbouncer_scram_result.query_result | length == pgbouncer_auth_users | length
    fail_msg: >
      Expected {{ pgbouncer_auth_users | length }} SCRAM verifiers
      ({{ pgbouncer_auth_users | join(', ') }}) but got
      {{ pgbouncer_scram_result.query_result | length }}.
      Ensure all users exist in PostgreSQL with SCRAM-SHA-256 passwords.
    quiet: true
  when: pgbouncer_auth_users | length > 0
  tags: [pgbouncer, pgbouncer-config]

- name: Store SCRAM verifiers as fact
  ansible.builtin.set_fact:
    pgbouncer_scram_verifiers: "{{ pgbouncer_scram_result.query_result | default([]) }}"
  no_log: true
  tags: [pgbouncer, pgbouncer-config]
