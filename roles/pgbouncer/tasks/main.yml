---
- name: Ensure psycopg2 and kubernetes Python libraries are present on control node
  ansible.builtin.pip:
    name:
      - psycopg2-binary
      - kubernetes
    state: present
    extra_args: "--user --break-system-packages"
  delegate_to: localhost
  run_once: true
  tags: [pgbouncer, pgbouncer-install, pgbouncer-config]

- name: Discover current Patroni primary
  ansible.builtin.include_tasks:
    file: "{{ role_path | dirname }}/patroni/tasks/find_primary.yml"
    apply:
      tags: [pgbouncer, pgbouncer-config]
  tags: [pgbouncer, pgbouncer-config]

- name: Fetch SCRAM verifiers from PostgreSQL primary
  ansible.builtin.include_tasks: fetch_verifiers.yml
  tags: [pgbouncer, pgbouncer-config]

- name: Render pgbouncer configuration
  ansible.builtin.include_tasks: render.yml
  tags: [pgbouncer, pgbouncer-config]

- name: Apply PgBouncer K8s resources
  ansible.builtin.include_tasks: apply.yml
  tags: [pgbouncer, pgbouncer-install, pgbouncer-config]
