---
# postgres user: shell=bash so Patroni can exec pg_ctl/psql via sudo -u postgres
- name: Create postgres system user
  ansible.builtin.user:
    name: postgres
    system: true
    shell: /bin/bash
    home: /var/lib/postgresql
    create_home: false
    comment: PostgreSQL Server
  tags: [os_prep, os_prep-config]

- name: Create etcd system user
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/etcd
    create_home: false
    comment: etcd
  tags: [os_prep, os_prep-config]

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  tags: [os_prep, os_prep-config]

- name: Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  tags: [os_prep, os_prep-config]
