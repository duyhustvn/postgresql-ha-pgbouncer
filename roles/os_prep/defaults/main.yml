---
# Mount point for the data partition (separate disk, NOT OS partition)
os_prep_data_mount: /u01

# Set to false to skip the mount point pre-flight check (e.g. in test/dev environments)
os_prep_verify_mount: true

# Base packages required on all PG nodes before any service is installed
os_prep_required_packages:
  - curl
  - gnupg
  - python3
  - python3-psycopg2
  - python3-pip
  - acl

# Huge pages: number of 2MB pages to reserve.
# Production (shared_buffers=16GB): 8400 pages.
# Get exact value after PG install: postgres -C shared_memory_size_in_huge_pages
# Set to 0 to DISABLE (safe for test VMs — avoids allocation failure)
os_prep_vm_nr_hugepages: 0

# 2 = never overcommit — prevents OOM killer from targeting PostgreSQL
os_prep_vm_overcommit_memory: 2

# Minimize swapping — PostgreSQL manages its own buffer cache
os_prep_vm_swappiness: 1

# TCP keepalive: detect failed connections faster (seconds)
os_prep_net_tcp_keepalive_time: 60

# SysV shared memory upper bound in bytes (must be >= shared_buffers in bytes)
# 17179869184 = 16GiB; reduce on small VMs
os_prep_kernel_shmmax: 17179869184

# Total shared memory pages = os_prep_kernel_shmmax / PAGE_SIZE (4096)
os_prep_kernel_shmall: 4194304

# File where all os_prep sysctl parameters are persisted
os_prep_sysctl_file: /etc/sysctl.d/99-ansible-os-prep.conf
