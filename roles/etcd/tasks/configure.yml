---
- name: Create etcd config directory
  ansible.builtin.file:
    path: "{{ etcd_config_dir }}"
    state: directory
    owner: root
    group: "{{ etcd_group }}"
    mode: "0750"
  tags: [etcd, etcd-config]

- name: Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: "0700"
  tags: [etcd, etcd-config]

- name: Template etcd config
  ansible.builtin.template:
    src: etcd.conf.yml.j2
    dest: "{{ etcd_config_dir }}/etcd.conf.yml"
    owner: root
    group: "{{ etcd_group }}"
    mode: "0640"
  notify: restart etcd
  tags: [etcd, etcd-config]

- name: Template etcd systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
  notify: restart etcd
  tags: [etcd, etcd-config]
