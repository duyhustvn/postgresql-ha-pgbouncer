---
- name: Reload systemd daemon before starting patroni leader
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [patroni, patroni-start]

- name: Enable and start patroni on leader node
  ansible.builtin.service:
    name: patroni
    state: started
    enabled: true
  tags: [patroni, patroni-start]

- name: Wait for Patroni primary REST endpoint to respond
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/primary"
    status_code: 200
  register: patroni_primary_check
  retries: 30
  delay: 5
  until: patroni_primary_check.status == 200
  tags: [patroni, patroni-start]
